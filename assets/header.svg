<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t">
  <title id="t">CyberTron957: AI engineer building agents that run 24/7</title>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#18202d"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#a78bfa" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0f6fc"/>
      <stop offset="1" stop-color="#9fb3c8"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="340" rx="20"/></clipPath>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
      .blink{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .flow{stroke-dasharray:4 7;animation:flow 1.4s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-22}}
      .busy{animation:busy 2.4s ease-in-out infinite}
      .b2{animation-delay:-.6s}.b3{animation-delay:-1.2s}.b4{animation-delay:-1.8s}
      @keyframes busy{0%,100%{opacity:.25}50%{opacity:1}}
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="#0b0f17"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <circle cx="960" cy="175" r="270" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="20" fill="none" stroke="#1f2937"/>

  <!-- terminal prompt -->
  <text x="64" y="92" class="mono" font-size="22" fill="#34d399">~ $</text>
  <text x="117" y="92" class="mono" font-size="22" fill="#e6edf3">whoami</text>
  <rect x="199" y="74" width="11" height="22" fill="#22d3ee" class="blink"/>

  <!-- identity -->
  <text x="62" y="162" class="mono" font-size="58" font-weight="700" fill="url(#title)" letter-spacing="-1">CyberTron957</text>
  <text x="64" y="208" class="sans" font-size="26" fill="#c9d1d9">AI engineer building agents that run 24/7</text>

  <g class="mono" font-size="15">
    <rect x="64" y="236" width="195" height="32" rx="16" fill="#111827" stroke="#263245"/>
    <text x="161.5" y="257" text-anchor="middle" fill="#22d3ee">multi-agent systems</text>
    <rect x="269" y="236" width="57" height="32" rx="16" fill="#111827" stroke="#263245"/>
    <text x="297.5" y="257" text-anchor="middle" fill="#a78bfa">RAG</text>
    <rect x="336" y="236" width="111" height="32" rx="16" fill="#111827" stroke="#263245"/>
    <text x="391.5" y="257" text-anchor="middle" fill="#34d399">LLM infra</text>
    <rect x="457" y="236" width="111" height="32" rx="16" fill="#111827" stroke="#263245"/>
    <text x="512.5" y="257" text-anchor="middle" fill="#fbbf24">dev tools</text>
  </g>

  <g class="mono" font-size="14" fill="#6e7681">
    <circle cx="70" cy="305" r="5" fill="#34d399" class="busy"/>
    <text x="84" y="310">4 agents online · working while you sleep</text>
  </g>

  <!-- agent graph -->
  <g fill="none" stroke="#263245" stroke-width="2">
    <path id="e1" d="M960,78 Q850,120 790,230"/>
    <path id="e2" d="M960,78 Q915,170 905,268"/>
    <path id="e3" d="M960,78 Q1005,170 1015,268"/>
    <path id="e4" d="M960,78 Q1070,120 1130,230"/>
  </g>
  <g fill="none" stroke="#2f3b52" stroke-width="1.6" class="flow">
    <path d="M790,230 Q840,262 905,268"/>
    <path d="M905,268 L1015,268"/>
    <path d="M1015,268 Q1080,262 1130,230"/>
  </g>

  <!-- packets: planner -> agent (cyan), agent -> planner (violet) -->
  <g>
    <circle r="4" fill="#22d3ee"><animateMotion dur="2.4s" begin="0s" repeatCount="indefinite"><mpath xlink:href="#e1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle>
    <circle r="4" fill="#22d3ee"><animateMotion dur="2.4s" begin="-0.6s" repeatCount="indefinite"><mpath xlink:href="#e2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/></circle>
    <circle r="4" fill="#22d3ee"><animateMotion dur="2.4s" begin="-1.2s" repeatCount="indefinite"><mpath xlink:href="#e3"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/></circle>
    <circle r="4" fill="#22d3ee"><animateMotion dur="2.4s" begin="-1.8s" repeatCount="indefinite"><mpath xlink:href="#e4"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/></circle>
    <circle r="3.5" fill="#a78bfa"><animateMotion dur="3.2s" begin="-0.3s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath xlink:href="#e1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="3.2s" begin="-0.3s" repeatCount="indefinite"/></circle>
    <circle r="3.5" fill="#a78bfa"><animateMotion dur="3.2s" begin="-2.1s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath xlink:href="#e3"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="3.2s" begin="-2.1s" repeatCount="indefinite"/></circle>
    <circle r="3.5" fill="#a78bfa"><animateMotion dur="3.2s" begin="-1.3s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath xlink:href="#e4"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="3.2s" begin="-1.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- planner node -->
  <circle cx="960" cy="78" r="22" fill="none" stroke="#22d3ee" stroke-width="1.5">
    <animate attributeName="r" values="18;30;18" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".6;0;.6" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="960" cy="78" r="15" fill="#0b0f17" stroke="#22d3ee" stroke-width="2.5"/>
  <circle cx="960" cy="78" r="5" fill="#22d3ee"/>
  <text x="992" y="72" class="mono" font-size="14" fill="#8b949e">planner</text>

  <!-- agent nodes -->
  <g stroke="#a78bfa" stroke-width="2" fill="#0b0f17">
    <circle cx="790" cy="230" r="11"/>
    <circle cx="905" cy="268" r="11"/>
    <circle cx="1015" cy="268" r="11"/>
    <circle cx="1130" cy="230" r="11"/>
  </g>
  <g fill="#34d399">
    <circle cx="790" cy="230" r="3.5" class="busy"/>
    <circle cx="905" cy="268" r="3.5" class="busy b2"/>
    <circle cx="1015" cy="268" r="3.5" class="busy b3"/>
    <circle cx="1130" cy="230" r="3.5" class="busy b4"/>
  </g>
  <g class="mono" font-size="14" fill="#8b949e" text-anchor="middle">
    <text x="790" y="264">research</text>
    <text x="905" y="302">build</text>
    <text x="1015" y="302">ship</text>
    <text x="1130" y="264">support</text>
  </g>
</svg>
